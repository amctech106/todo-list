<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #fdfbda;
        flex-direction: column;
    }

    #main{
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 1px 1px 10px #000;
    }

    #inp, #btn{
        padding: 8px;
        border-radius: 5px;
        margin: 3px;
    }

    h1{
        text-align: center;
    }

    #btn{
        cursor: pointer;
    }
#result{
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        margin-top: 5px; 
        line-height: 30px;
         
}



</style>
</head>
<body>
    <div id="main">
        <h1>Add Tasks</h1>
        <input id="inp" type="text" placeholder="Add Task">
        <button id="btn">add</button>
        <p id="result">

    </p>
    </div>
    
    
    <script src="script.js"></script>

</body>
</html>
